AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Stage 04B - CloudFormation-managed SQL initialization and tests via SSM /
  initialisation SQL et tests pilotes par CloudFormation et SSM.
Parameters:
  MasterSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-2:[0-9]{12}:secret:.+$'
    Description: Existing RDS master secret ARN / ARN du secret administrateur RDS existant.
  RdsEndpoint:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9.-]+\.us-east-2\.rds\.amazonaws\.com$'
    Description: Private RDS DNS endpoint / nom DNS prive de RDS.
  BastionInstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Existing bastion for SQL initialization / bastion existant pour initialiser SQL.
  WebAInstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Existing private web A for SQL tests / serveur web A prive pour les tests SQL.
  WebBInstanceId:
    Type: AWS::EC2::Instance::Id
    Description: Existing private web B for SQL tests / serveur web B prive pour les tests SQL.
  RunSqlBootstrap:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable after instance profiles and SSM are ready / activer apres les profils et SSM.
Conditions:
  RunSql: !Equals [!Ref RunSqlBootstrap, 'true']
Resources:
  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: Lab appuser password / mot de passe appuser du lab
      GenerateSecretString:
        SecretStringTemplate: '{"username":"appuser","dbname":"labapp"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
        RequireEachIncludedType: true
      Tags:
        - {Key: Project, Value: lab6}
  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: ReadLabSqlSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref MasterSecretArn, !Ref ApplicationSecret]
      Tags:
        - {Key: Project, Value: lab6}
  BastionProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BastionRole]
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: ReadApplicationSecretOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApplicationSecret
      Tags:
        - {Key: Project, Value: lab6}
  WebProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebRole]
  SqlDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '2.2'
        description: Initialize from bastion, test from private web / initialiser puis tester SQL
        parameters:
          Mode:
            type: String
            allowedValues: [initialize, test]
        mainSteps:
          - action: aws:runShellScript
            name: RunLabSql
            inputs:
              timeoutSeconds: '900'
              runCommand:
                - Fn::Sub: |
                    #!/usr/bin/env bash
                    set -euo pipefail
                    umask 077
                    export LAB_REGION='${AWS::Region}'
                    export LAB_MASTER_SECRET_ARN='${MasterSecretArn}'
                    export LAB_APP_SECRET_ARN='${ApplicationSecret}'
                    export LAB_DB_HOST='${RdsEndpoint}'
                    export LAB_SQL_MODE='{{ Mode }}'
                    export LAB_CA_FILE=/opt/lab6-sql/rds-ca.pem
                    mkdir -p /opt/lab6-sql
                    command -v aws >/dev/null
                    command -v curl >/dev/null
                    dnf -y install python3 python3-pip > /var/log/lab6-sql-packages.log 2>&1
                    python3 -m venv /opt/lab6-sql/venv
                    /opt/lab6-sql/venv/bin/python -m pip install --quiet --disable-pip-version-check 'PyMySQL[rsa]==1.2.3'
                    curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 60 \
                      https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o "$LAB_CA_FILE"
                    /opt/lab6-sql/venv/bin/python - <<'PYSQL'
                    """Executed by the CloudFormation-managed SSM document; no secret values are logged."""
                    import json
                    import os
                    import ssl
                    import subprocess
                    import sys
                    import time
                    import uuid

                    import pymysql

                    HOSTS = ("10.10.11.0/255.255.255.0", "10.10.12.0/255.255.255.0")
                    STEP = "start"


                    def credentials(arn):
                        for attempt in range(8):
                            result = subprocess.run(
                                ["aws", "secretsmanager", "get-secret-value", "--secret-id", arn,
                                 "--region", os.environ["LAB_REGION"], "--query", "SecretString",
                                 "--output", "text", "--no-cli-pager"],
                                capture_output=True, text=True, timeout=45, check=False,
                            )
                            if result.returncode == 0:
                                value = json.loads(result.stdout)
                                if value.get("username") and value.get("password"):
                                    return value
                                raise ValueError("invalid credential structure")
                            if attempt < 7:
                                time.sleep(5)
                        raise RuntimeError("secret retrieval failed")


                    def connect(account, autocommit=False):
                        context = ssl.create_default_context(cafile=os.environ["LAB_CA_FILE"])
                        context.minimum_version = ssl.TLSVersion.TLSv1_2
                        context.check_hostname = True
                        context.verify_mode = ssl.CERT_REQUIRED
                        return pymysql.connect(
                            host=os.environ["LAB_DB_HOST"], port=3306, user=account["username"],
                            password=account["password"], database="labapp", charset="utf8mb4",
                            ssl=context, connect_timeout=15, read_timeout=30, write_timeout=30,
                            autocommit=autocommit,
                        )


                    def cipher(cursor):
                        cursor.execute("SHOW SESSION STATUS LIKE 'Ssl_cipher'")
                        value = cursor.fetchone()[1]
                        if not value:
                            raise RuntimeError("TLS not negotiated")
                        return value


                    def initialize(app):
                        global STEP
                        STEP = "master_credentials"
                        master = credentials(os.environ["LAB_MASTER_SECRET_ARN"])
                        STEP = "admin_tls_connection"
                        with connect(master, autocommit=True) as conn, conn.cursor() as cur:
                            negotiated = cipher(cur)
                            STEP = "schema"
                            for ddl in (
                                """CREATE TABLE IF NOT EXISTS courses (
                                    id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                                    code VARCHAR(20) NOT NULL UNIQUE, title VARCHAR(120) NOT NULL,
                                    track VARCHAR(40) NOT NULL, hours SMALLINT UNSIGNED NOT NULL
                                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci""",
                                """CREATE TABLE IF NOT EXISTS students (
                                    id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
                                    full_name VARCHAR(100) NOT NULL, email VARCHAR(120) NOT NULL UNIQUE,
                                    city VARCHAR(60), created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
                                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci""",
                                """CREATE TABLE IF NOT EXISTS enrollments (
                                    student_id INT UNSIGNED NOT NULL, course_id INT UNSIGNED NOT NULL,
                                    status ENUM('ENROLLED','COMPLETED','DROPPED') NOT NULL DEFAULT 'ENROLLED',
                                    enrolled_on DATE NOT NULL, PRIMARY KEY (student_id,course_id),
                                    CONSTRAINT fk_enr_student FOREIGN KEY (student_id) REFERENCES students(id) ON DELETE CASCADE,
                                    CONSTRAINT fk_enr_course FOREIGN KEY (course_id) REFERENCES courses(id) ON DELETE CASCADE
                                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci""",
                            ):
                                cur.execute(ddl)
                            cur.execute("""CREATE OR REPLACE SQL SECURITY INVOKER VIEW v_course_stats AS
                                SELECT c.code, c.title, COUNT(e.student_id) AS total_enrolled,
                                  COALESCE(SUM(e.status='COMPLETED'),0) AS completed,
                                  COALESCE(SUM(e.status='DROPPED'),0) AS dropped
                                FROM courses c LEFT JOIN enrollments e ON e.course_id=c.id
                                GROUP BY c.id,c.code,c.title""")
                            STEP = "sample_data"
                            courses = [
                                ("AWS-BASE", "AWS foundations / Fondamentaux AWS", "Cloud", 12),
                                ("AWS-IAM", "IAM identities / Identites IAM", "Security", 10),
                                ("AWS-VPC", "VPC routing / Routage VPC", "Networking", 16),
                                ("AWS-EC2", "EC2 instances / Instances EC2", "Compute", 14),
                                ("AWS-S3", "Object storage / Stockage objet", "Storage", 10),
                                ("AWS-RDS", "Managed databases / Bases gerees", "Database", 12),
                                ("AWS-CFN", "CloudFormation templates", "Automation", 12),
                                ("AWS-OBS", "Monitoring / Supervision", "Operations", 8),
                            ]
                            cur.executemany("INSERT IGNORE INTO courses(code,title,track,hours) VALUES(%s,%s,%s,%s)", courses)
                            students = [(f"Learner {i:02}", f"learner{i:02}@example.com", "Demo") for i in range(1, 13)]
                            cur.executemany("INSERT IGNORE INTO students(full_name,email,city) VALUES(%s,%s,%s)", students)
                            for i in range(1, 13):
                                cur.execute("""INSERT IGNORE INTO enrollments(student_id,course_id,status,enrolled_on)
                                    SELECT s.id,c.id,'ENROLLED',CURRENT_DATE()
                                    FROM students s JOIN courses c ON c.code=%s WHERE s.email=%s""",
                                    (courses[(i-1) % len(courses)][0], f"learner{i:02}@example.com"))
                            STEP = "application_grants"
                            for host in HOSTS:
                                cur.execute("CREATE USER IF NOT EXISTS %s@%s IDENTIFIED BY %s REQUIRE SSL", ("appuser", host, app["password"]))
                                cur.execute("ALTER USER %s@%s IDENTIFIED BY %s REQUIRE SSL", ("appuser", host, app["password"]))
                                cur.execute("REVOKE ALL PRIVILEGES, GRANT OPTION FROM %s@%s", ("appuser", host))
                                cur.execute("GRANT SELECT,INSERT,UPDATE,DELETE ON labapp.* TO %s@%s", ("appuser", host))
                            cur.execute("SELECT Host FROM mysql.user WHERE User='appuser'")
                            if {row[0] for row in cur.fetchall()} != set(HOSTS):
                                raise RuntimeError("unexpected application account hosts")
                            for host in HOSTS:
                                cur.execute("SHOW GRANTS FOR %s@%s", ("appuser", host))
                                for row in cur.fetchall():
                                    print("GRANT_CHECK", row[0])
                            cur.execute("SELECT COUNT(*) FROM students")
                            student_count = cur.fetchone()[0]
                        STEP = "bastion_app_login_must_fail"
                        try:
                            unexpected = connect(app)
                        except pymysql.err.OperationalError as exc:
                            if exc.args[0] != 1045:
                                raise
                        else:
                            unexpected.close()
                            raise RuntimeError("application login unexpectedly allowed from bastion")
                        print(f"SQL_INIT_OK tls={negotiated} students={student_count} app_login_from_bastion=denied")


                    def test_application(app):
                        global STEP
                        STEP = "iam_master_secret_must_be_denied"
                        denied = subprocess.run(
                            ["aws", "secretsmanager", "get-secret-value", "--secret-id", os.environ["LAB_MASTER_SECRET_ARN"],
                             "--region", os.environ["LAB_REGION"], "--output", "json", "--no-cli-pager"],
                            capture_output=True, text=True, timeout=45, check=False,
                        )
                        if denied.returncode == 0 or "AccessDeniedException" not in denied.stderr:
                            raise RuntimeError("administrator secret access not denied by IAM")
                        STEP = "application_tls_connection"
                        with connect(app) as conn:
                            try:
                                with conn.cursor() as cur:
                                    negotiated = cipher(cur)
                                    cur.execute("SELECT CURRENT_USER()")
                                    account = cur.fetchone()[0]
                                    if account not in {f"appuser@{host}" for host in HOSTS}:
                                        raise RuntimeError("unexpected SQL account")
                                    STEP = "application_crud"
                                    email = f"probe-{uuid.uuid4().hex}@example.invalid"
                                    cur.execute("INSERT INTO students(full_name,email,city) VALUES(%s,%s,%s)", ("Transaction probe", email, "Initial"))
                                    row_id = cur.lastrowid
                                    cur.execute("SELECT city FROM students WHERE id=%s", (row_id,))
                                    if cur.fetchone()[0] != "Initial":
                                        raise RuntimeError("insert/select check failed")
                                    cur.execute("UPDATE students SET city=%s WHERE id=%s", ("Updated", row_id))
                                    cur.execute("SELECT city FROM students WHERE id=%s", (row_id,))
                                    if cur.fetchone()[0] != "Updated":
                                        raise RuntimeError("update check failed")
                                    cur.execute("DELETE FROM students WHERE id=%s", (row_id,))
                                    cur.execute("SELECT COUNT(*) FROM students WHERE id=%s", (row_id,))
                                    if cur.fetchone()[0] != 0:
                                        raise RuntimeError("delete check failed")
                                    conn.rollback()
                                    STEP = "administrator_access_must_fail"
                                    try:
                                        cur.execute("SELECT 1 FROM mysql.user LIMIT 0")
                                    except pymysql.err.OperationalError as exc:
                                        if exc.args[0] not in (1044, 1142):
                                            raise
                                    else:
                                        raise RuntimeError("administrator table unexpectedly accessible")
                                    print(f"SQL_APP_OK account={account} tls={negotiated} SELECT_INSERT_UPDATE_DELETE=ok admin_table=denied master_secret=denied")
                            finally:
                                conn.rollback()


                    def main():
                        global STEP
                        STEP = "application_credentials"
                        app = credentials(os.environ["LAB_APP_SECRET_ARN"])
                        if app["username"] != "appuser":
                            raise ValueError("unexpected application username")
                        if os.environ["LAB_SQL_MODE"] == "initialize":
                            initialize(app)
                        elif os.environ["LAB_SQL_MODE"] == "test":
                            test_application(app)
                        else:
                            raise ValueError("invalid execution mode")


                    if __name__ == "__main__":
                        try:
                            main()
                        except Exception as exc:
                            # Deliberately omit error messages, queries and credential values / aucun secret dans les journaux.
                            number = exc.args[0] if exc.args and isinstance(exc.args[0], int) else "n/a"
                            print(f"SQL_FAILED step={STEP} error={type(exc).__name__} code={number}", file=sys.stderr)
                            sys.exit(1)
                    PYSQL
  InitializeAssociation:
    Type: AWS::SSM::Association
    Condition: RunSql
    Properties:
      Name: !Ref SqlDocument
      DocumentVersion: '$LATEST'
      Parameters:
        Mode: [initialize]
      Targets:
        - Key: InstanceIds
          Values: [!Ref BastionInstanceId]
      WaitForSuccessTimeoutSeconds: 1200
  WebATestAssociation:
    Type: AWS::SSM::Association
    Condition: RunSql
    DependsOn: InitializeAssociation
    Properties:
      Name: !Ref SqlDocument
      DocumentVersion: '$LATEST'
      Parameters:
        Mode: [test]
      Targets:
        - Key: InstanceIds
          Values: [!Ref WebAInstanceId]
      WaitForSuccessTimeoutSeconds: 1200
  WebBTestAssociation:
    Type: AWS::SSM::Association
    Condition: RunSql
    DependsOn: InitializeAssociation
    Properties:
      Name: !Ref SqlDocument
      DocumentVersion: '$LATEST'
      Parameters:
        Mode: [test]
      Targets:
        - Key: InstanceIds
          Values: [!Ref WebBInstanceId]
      WaitForSuccessTimeoutSeconds: 1200
Outputs:
  AppSecretArn:
    Value: !Ref ApplicationSecret
  BastionProfileName:
    Value: !Ref BastionProfile
  WebProfileName:
    Value: !Ref WebProfile
  SqlDocumentName:
    Value: !Ref SqlDocument
  InitializeAssociationId:
    Condition: RunSql
    Value: !Ref InitializeAssociation
  WebAAssociationId:
    Condition: RunSql
    Value: !Ref WebATestAssociation
  WebBAssociationId:
    Condition: RunSql
    Value: !Ref WebBTestAssociation
