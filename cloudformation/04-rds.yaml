AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Stage 04A - private RDS MySQL, TLS and managed admin secret /
  RDS MySQL prive, TLS et secret administrateur gere.

Parameters:
  ProjectName:
    Type: String
    Default: lab6
    AllowedPattern: '^[a-z][a-z0-9-]{1,23}$'
    Description: Resource prefix / prefixe des ressources.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing lab VPC / VPC existant du lab.
  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet AZ A / sous-reseau prive AZ A.
  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet AZ B / sous-reseau prive AZ B.
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Single-AZ database placement / emplacement de la base Single-AZ.
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing RDS security group / groupe RDS existant de l'etape 02.
  EngineVersion:
    Type: String
    AllowedPattern: '^8\.4\.[0-9]+$'
    Description: Available MySQL 8.4 patch checked by script / version 8.4 disponible verifiee par le script.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t3.micro]
    Description: Small lab DB instance / petite instance de base pour le lab.

Resources:
  # A subnet group references subnets; it does not create a second DB / ce groupe ne cree pas une deuxieme base.
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Two private subnets / deux sous-reseaux prives
      SubnetIds: [!Ref PrivateSubnetAId, !Ref PrivateSubnetBId]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-db-subnets'}
        - {Key: Project, Value: !Ref ProjectName}

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Require encrypted MySQL connections / connexions MySQL chiffrees obligatoires
      Family: mysql8.4
      Parameters:
        require_secure_transport: '1'
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-mysql84-tls'}
        - {Key: Project, Value: !Ref ProjectName}

  Database:
    Type: AWS::RDS::DBInstance
    # Disposable learning data: no final snapshot / donnees temporaires du lab, sans snapshot final.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-mysql'
      Engine: mysql
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: labapp
      MasterUsername: admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups: [!Ref RdsSecurityGroupId]
      AvailabilityZone: !Ref AvailabilityZoneA
      MultiAZ: false
      PubliclyAccessible: false
      NetworkType: IPV4
      Port: '3306'
      StorageType: gp3
      AllocatedStorage: '20'
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: false
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      MonitoringInterval: 0
      EnablePerformanceInsights: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-mysql'}
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Purpose, Value: TemporaryLearningLab}

Outputs:
  VpcId:
    Value: !Ref VpcId
  DbInstanceIdentifier:
    Value: !Ref Database
  DbEndpoint:
    Description: Private SQL hostname, not a website / nom DNS SQL prive.
    Value: !GetAtt Database.Endpoint.Address
  DbPort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: labapp
  DbSubnetGroupName:
    Value: !Ref DbSubnetGroup
  DbParameterGroupName:
    Value: !Ref DbParameterGroup
  MasterSecretArn:
    Description: Secret identifier only; password never output / identifiant du secret uniquement.
    Value: !GetAtt Database.MasterUserSecret.SecretArn
